name: Render diagrams

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@12.0.0
      - name: Allow Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Render diagrams
        run: |
          while IFS= read -r -d '' file; do
            out="generated/${file#diagrams/}"
            out="${out%.mmd}.svg"
            mkdir -p "$(dirname "$out")"
            mmdc -i "$file" -o "$out"
          done < <(git ls-files -z 'diagrams/*.mmd')
      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --staged --quiet || git commit -m "Render Mermaid diagrams"
          git push
